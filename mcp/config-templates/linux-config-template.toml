[mcp]
remote_mcp_client_enabled = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.composio]
url = "https://connect.composio.dev/mcp"

[mcp_servers.composio.http_headers]
x-consumer-api-key = "<COMPOSIO_API_KEY>"

[mcp_servers.context7]
type = "http"
url = "https://mcp.context7.com/mcp"

[mcp_servers.context7.http_headers]
CONTEXT7_API_KEY = "<CONTEXT7_API_KEY>"

[mcp_servers.gsap]
command = "node"
args = ["$HOME/.codex/mcp/gsap/start-gsap-mcp.mjs"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.shadcn]
command = "npx"
args = ["-y", "shadcn@latest", "mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.chakra-ui]
command = "npx"
args = ["-y", "@chakra-ui/react-mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.filesystem]
command = "npx"
args = [
  "-y",
  "@modelcontextprotocol/server-filesystem",
  "<WORKSPACE_ROOT>",
  "<REFERENCES_ROOT>",
  "<KNOWLEDGE_BASE_ROOT>"
]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.supabase]
url = "https://mcp.supabase.com/mcp?project_ref=<SUPABASE_PROJECT_REF>&read_only=true"

[mcp_servers.vercel]
url = "https://mcp.vercel.com"

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.stitch]
url = "https://stitch.googleapis.com/mcp"

[mcp_servers.stitch.http_headers]
X-Goog-Api-Key = "<STITCH_API_KEY>"
